name: Run Tests

env:
  SDK_BRANCH_NAME: ${{ inputs.sdk_branch  || github.head_ref || github.ref_name || 'main' }}
  TEST_DATA_BRANCH_NAME: ${{ inputs.test_data_branch || 'main' }}

on:
  push:
    branches: [ "main" ]

  pull_request:

  # Catches upstream releases that break our declared ranges.
  schedule:
    - cron: '17 6 * * 1'

  workflow_dispatch:

  workflow_call:
    inputs:
      test_data_branch:
        type: string
        description: The branch in sdk-test-data to target for testcase files
        required: false
        default: main
      sdk_branch:
        type: string
        description: The branch of the SDK to test
        required: false

permissions:
  contents: read

jobs:
  build-and-test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One leg per branch of the symfony/cache constraint. Each Symfony major
          # raises its PHP floor, so the runner PHP selects the branch:
          # 8.3 resolves ^7.0, 8.4 resolves ^8.0.
          - { php: '8.1', deps: locked }
          - { php: '8.3', deps: locked }
          - { php: '8.1', deps: lowest }
          - { php: '8.3', deps: highest }
          - { php: '8.4', deps: highest }

    name: build-and-test (PHP ${{ matrix.php }}, ${{ matrix.deps }})

    steps:
    - name: Display Testing Details
      run: |
        echo "Running SDK Test using"
        echo "Test Data: sdk-test-data@${TEST_DATA_BRANCH_NAME}"
        echo "SDK Branch: php-sdk@${SDK_BRANCH_NAME}"
        echo "PHP: ${{ matrix.php }}, dependencies: ${{ matrix.deps }}"

    - uses: actions/checkout@v5
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name || 'Eppo-exp/php-sdk' }}
        ref: ${{ env.SDK_BRANCH_NAME }}

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: json, pcntl, posix, sockets
        coverage: none

    # Must run before any resolution, or --strict cannot check lock sync.
    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    # config.platform.php guards composer.lock. It must not cap a throwaway
    # resolution, or symfony/cache ^8 stays unreachable.
    - name: Target the runner's PHP for highest-version resolution
      if: matrix.deps == 'highest'
      run: composer config --unset platform.php

    # The PHP suffix separates the two highest legs. They share a composer.json,
    # so only the runner PHP tells their caches apart.
    - name: Install dependencies
      uses: ramsey/composer-install@4.0.0
      with:
        dependency-versions: ${{ matrix.deps }}
        composer-options: --prefer-dist
        custom-cache-suffix: php-${{ matrix.php }}

    - name: Show resolved direct dependencies
      run: composer show --direct

    # --no-dev: a dev-only advisory reaches nobody who installs the SDK.
    - name: Audit production dependencies
      if: matrix.deps == 'locked'
      run: composer audit --no-dev

    - name: Run tests
      run: make test branchName=${{env.TEST_DATA_BRANCH_NAME}}
